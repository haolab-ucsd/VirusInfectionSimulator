[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsim"
version = "0.1.0"
description = "Stochastic spatial infection simulator using Tellurium"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "joblib",
    "tellurium"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]